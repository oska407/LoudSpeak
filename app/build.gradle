plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.oska.loudspeak'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oska.loudspeak'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX（M2 起用于 1280×720 横屏 → 裁 544×720 采集）
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // camera-video 提供 VideoCapture / Recorder（B1 采集验证录制用）
    implementation 'androidx.camera:camera-video:1.3.4'

    // ONNX Runtime Mobile（M2 起用于 SenseVoice / Qwen3 推理）——
    // 暂不在 M0 引入：其 AAR 含全 ABI，APK 会膨胀到 ~100MB+；
    // M2 接入时会加 ndk.abiFilters 'arm64-v8a' 只留 OPPO A3x 需要的架构。
}
