name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release（APK 免登录直链下载）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 手动安装 Android SDK（不依赖第三方有失效风险的 android-actions/setup-android@v3）
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          which unzip >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y unzip; }
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cli.zip
          unzip -q cli.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      # 失败时把错误尾部写进运行摘要（无需登录即可在 run 页面读到）
      - name: Write error tail to summary
        if: failure()
        run: |
          {
            echo "### Build failure - log tail"
            echo '```'
            tail -150 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: loudspeak-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 主通道：Release（免登录直链下载）
      - name: Publish APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug APK (latest)
          body: CI 自动编译的最新调试包，直接下载安装即可
          files: app/build/outputs/apk/debug/*.apk
          overwrite_files: true

      # 兜底通道：把 APK 推到 apk 分支（公开仓库可匿名 git 拉取）
      - name: Publish APK to apk branch
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        run: |
          set -e
          mkdir -p /tmp/apkpub
          cp app/build/outputs/apk/debug/*.apk /tmp/apkpub/app-debug.apk
          cd /tmp/apkpub
          git init -q -b apk
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "apk $(date -u +%Y%m%d-%H%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
